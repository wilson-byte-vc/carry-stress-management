<svg viewBox="0 0 2000 2000" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="2000" height="2000" fill="#0f1420"/>

  <!-- ===================== CONNECTORS ===================== -->
  <g fill="none" stroke-width="3">
    <!-- root to branches -->
    <path d="M 300 1005 C 400 1005, 380 310, 440 310"  stroke="#3fae72"/>
    <path d="M 300 1005 C 400 1005, 400 1005, 440 1005" stroke="#5aa7e0"/>
    <path d="M 300 1005 C 400 1005, 380 1700, 440 1700" stroke="#a3a8b3"/>

    <!-- branch 1 (Load Model) to leaves -->
    <path d="M 720 300 C 800 300, 800 60,  880 60"  stroke="#3fae72"/>
    <path d="M 720 310 C 800 310, 800 205, 880 205" stroke="#3fae72"/>
    <path d="M 720 320 C 800 320, 800 350, 880 350" stroke="#3fae72"/>
    <path d="M 720 330 C 800 330, 800 495, 880 495" stroke="#3fae72"/>
    <path d="M 720 340 C 800 340, 800 640, 880 640" stroke="#8b8f99"/>

    <!-- branch 2 (Core Solution) to leaves -->
    <path d="M 720 975  C 800 975,  800 820,  880 820"  stroke="#5aa7e0"/>
    <path d="M 720 1005 C 800 1005, 800 1005, 880 1005" stroke="#5aa7e0"/>
    <path d="M 720 1035 C 800 1035, 800 1190, 880 1190" stroke="#5aa7e0"/>

    <!-- branch 3 (Explored & Dropped) to leaves -->
    <path d="M 720 1660 C 800 1660, 800 1330, 880 1330" stroke="#a3a8b3"/>
    <path d="M 720 1670 C 800 1670, 800 1450, 880 1450" stroke="#a3a8b3"/>
    <path d="M 720 1680 C 800 1680, 800 1570, 880 1570" stroke="#a3a8b3"/>
    <path d="M 720 1690 C 800 1690, 800 1690, 880 1690" stroke="#a3a8b3"/>
    <path d="M 720 1700 C 800 1700, 800 1810, 880 1810" stroke="#a3a8b3"/>
    <path d="M 720 1710 C 800 1710, 800 1930, 880 1930" stroke="#a3a8b3"/>
  </g>

  <!-- ===================== ROOT ===================== -->
  <g>
    <rect x="60" y="950" width="240" height="110" rx="18" fill="#1b2130" stroke="#f5f6f8" stroke-width="2.5"/>
    <text x="180" y="998" text-anchor="middle" fill="#f5f6f8" font-size="30" font-weight="700">CARRY</text>
    <text x="180" y="1030" text-anchor="middle" fill="#94969c" font-size="15">core ideation map</text>
  </g>

  <!-- ===================== BRANCH: LOAD MODEL ===================== -->
  <g>
    <rect x="440" y="260" width="280" height="100" rx="16" fill="#123626" stroke="#3fae72" stroke-width="2.5"/>
    <text x="580" y="300" text-anchor="middle" fill="#eafff2" font-size="21" font-weight="700">Load Model</text>
    <text x="580" y="325" text-anchor="middle" fill="#8fd6ac" font-size="14">the 4 numbers behind "capacity"</text>
    <text x="580" y="345" text-anchor="middle" fill="#8fd6ac" font-size="13">kept</text>
  </g>
  <!-- leaves -->
  <g>
    <rect x="880" y="20"  width="420" height="80" rx="12" fill="#16241d" stroke="#3fae72" stroke-width="2"/>
    <text x="900" y="52" fill="#eafff2" font-size="18" font-weight="600">Time Load</text>
    <text x="900" y="76" fill="#8fd6ac" font-size="13">kept — feeds the capacity formula</text>

    <rect x="880" y="165" width="420" height="80" rx="12" fill="#16241d" stroke="#3fae72" stroke-width="2"/>
    <text x="900" y="197" fill="#eafff2" font-size="18" font-weight="600">Social Load</text>
    <text x="900" y="221" fill="#8fd6ac" font-size="13">kept — feeds the capacity formula</text>

    <rect x="880" y="310" width="420" height="80" rx="12" fill="#16241d" stroke="#3fae72" stroke-width="2"/>
    <text x="900" y="342" fill="#eafff2" font-size="18" font-weight="600">Physical Load</text>
    <text x="900" y="366" fill="#8fd6ac" font-size="13">kept — feeds the capacity formula</text>

    <rect x="880" y="455" width="420" height="80" rx="12" fill="#16241d" stroke="#3fae72" stroke-width="2"/>
    <text x="900" y="487" fill="#eafff2" font-size="18" font-weight="600">Mental Load</text>
    <text x="900" y="511" fill="#8fd6ac" font-size="13">kept — feeds the capacity formula</text>

    <rect x="880" y="600" width="420" height="80" rx="12" fill="#241a1a" stroke="#8b8f99" stroke-width="2"/>
    <text x="900" y="632" fill="#eceef1" font-size="18" font-weight="600">Errand Load</text>
    <text x="900" y="656" fill="#b7bbc4" font-size="13">dropped — users won't log personal errands</text>
  </g>

  <!-- ===================== BRANCH: CORE SOLUTION ===================== -->
  <g>
    <rect x="440" y="955" width="280" height="100" rx="16" fill="#0f2a3d" stroke="#5aa7e0" stroke-width="2.5"/>
    <text x="580" y="995" text-anchor="middle" fill="#e8f4ff" font-size="21" font-weight="700">Core Solution</text>
    <text x="580" y="1020" text-anchor="middle" fill="#9cc9ef" font-size="14">what shipped</text>
    <text x="580" y="1040" text-anchor="middle" fill="#9cc9ef" font-size="13">kept + built</text>
  </g>
  <g>
    <rect x="880" y="780" width="460" height="90" rx="12" fill="#0d2130" stroke="#5aa7e0" stroke-width="2"/>
    <text x="900" y="812" fill="#e8f4ff" font-size="18" font-weight="600">Cost of Yes</text>
    <text x="900" y="835" fill="#9cc9ef" font-size="13">main solution — previews the capacity</text>
    <text x="900" y="854" fill="#9cc9ef" font-size="13">spike before you accept anything new</text>

    <rect x="880" y="965" width="460" height="90" rx="12" fill="#0d2130" stroke="#5aa7e0" stroke-width="2"/>
    <text x="900" y="997" fill="#e8f4ff" font-size="18" font-weight="600">Say-no drafts</text>
    <text x="900" y="1020" fill="#9cc9ef" font-size="13">pairs with Cost of Yes — AI writes the</text>
    <text x="900" y="1039" fill="#9cc9ef" font-size="13">decline citing a real fixed commitment</text>

    <rect x="880" y="1150" width="460" height="90" rx="12" fill="#0d2130" stroke="#5aa7e0" stroke-width="2"/>
    <text x="900" y="1182" fill="#e8f4ff" font-size="18" font-weight="600">Zero-input tracking</text>
    <text x="900" y="1205" fill="#9cc9ef" font-size="13">hardware version too complex — evolved</text>
    <text x="900" y="1224" fill="#9cc9ef" font-size="13">into reading the timetable/schedule instead</text>
  </g>

  <!-- ===================== BRANCH: EXPLORED & DROPPED ===================== -->
  <g>
    <rect x="440" y="1650" width="280" height="100" rx="16" fill="#241f16" stroke="#a3a8b3" stroke-width="2.5"/>
    <text x="580" y="1690" text-anchor="middle" fill="#f0f1f3" font-size="21" font-weight="700">Explored &amp; Dropped</text>
    <text x="580" y="1715" text-anchor="middle" fill="#c7cad1" font-size="14">breadth of exploration</text>
    <text x="580" y="1735" text-anchor="middle" fill="#c7cad1" font-size="13">8 ideas weighed and cut</text>
  </g>
  <g>
    <rect x="880" y="1290" width="480" height="80" rx="12" fill="#201c1c" stroke="#a3a8b3" stroke-width="2"/>
    <text x="900" y="1320" fill="#eceef1" font-size="17" font-weight="600">Voting Peers System</text>
    <text x="900" y="1344" fill="#b7bbc4" font-size="12">dropped — ethical issues despite being unique</text>

    <rect x="880" y="1410" width="480" height="80" rx="12" fill="#201c1c" stroke="#a3a8b3" stroke-width="2"/>
    <text x="900" y="1440" fill="#eceef1" font-size="17" font-weight="600">Health Record area</text>
    <text x="900" y="1464" fill="#b7bbc4" font-size="12">dropped — off target group, doesn't solve stress</text>

    <rect x="880" y="1530" width="480" height="80" rx="12" fill="#201c1c" stroke="#a3a8b3" stroke-width="2"/>
    <text x="900" y="1560" fill="#eceef1" font-size="17" font-weight="600">Legal Rights section</text>
    <text x="900" y="1584" fill="#b7bbc4" font-size="12">dropped — no legal domain expertise on team</text>

    <rect x="880" y="1650" width="480" height="80" rx="12" fill="#201c1c" stroke="#a3a8b3" stroke-width="2"/>
    <text x="900" y="1680" fill="#eceef1" font-size="17" font-weight="600">Skill Mastery / AI task-creation</text>
    <text x="900" y="1704" fill="#b7bbc4" font-size="12">dropped — doesn't solve stress short-term</text>

    <rect x="880" y="1770" width="480" height="80" rx="12" fill="#201c1c" stroke="#a3a8b3" stroke-width="2"/>
    <text x="900" y="1800" fill="#eceef1" font-size="17" font-weight="600">Mental Support Section</text>
    <text x="900" y="1824" fill="#b7bbc4" font-size="12">dropped — redundant with ChatGPT per mentor</text>

    <rect x="880" y="1890" width="480" height="80" rx="12" fill="#201c1c" stroke="#a3a8b3" stroke-width="2"/>
    <text x="900" y="1920" fill="#eceef1" font-size="17" font-weight="600">Lecturer feedback</text>
    <text x="900" y="1944" fill="#b7bbc4" font-size="12">dropped — uncertain a lecturer would act on it</text>
  </g>

  <!-- second row of dropped leaves (deadline restriction + bully detection) -->
  <g>
    <rect x="1400" y="1770" width="480" height="80" rx="12" fill="#201c1c" stroke="#a3a8b3" stroke-width="2"/>
    <text x="1420" y="1800" fill="#eceef1" font-size="17" font-weight="600">Deadline &#8594; entertainment lock</text>
    <text x="1420" y="1824" fill="#b7bbc4" font-size="12">dropped — became a burden to the team itself</text>

    <rect x="1400" y="1890" width="480" height="80" rx="12" fill="#2a1616" stroke="#d1483a" stroke-width="2"/>
    <text x="1420" y="1920" fill="#ffe3df" font-size="17" font-weight="600">Bully / self-harm detection</text>
    <text x="1420" y="1944" fill="#f0a89f" font-size="12">worst idea — serious ethical risk, dropped fast</text>
  </g>
  <path d="M 1360 1810 C 1380 1810, 1380 1810, 1400 1810" fill="none" stroke="#a3a8b3" stroke-width="3"/>
  <path d="M 1360 1930 C 1380 1930, 1380 1930, 1400 1930" fill="none" stroke="#d1483a" stroke-width="3"/>

  <!-- legend -->
  <g font-size="15" fill="#c7cad1">
    <rect x="1420" y="60" width="22" height="22" rx="5" fill="#16241d" stroke="#3fae72" stroke-width="2"/>
    <text x="1452" y="77">Kept / shipped</text>
    <rect x="1420" y="100" width="22" height="22" rx="5" fill="#0d2130" stroke="#5aa7e0" stroke-width="2"/>
    <text x="1452" y="117">Core solution (built)</text>
    <rect x="1420" y="140" width="22" height="22" rx="5" fill="#201c1c" stroke="#a3a8b3" stroke-width="2"/>
    <text x="1452" y="157">Explored, then dropped</text>
  </g>

  <text x="1000" y="1970" text-anchor="middle" fill="#5a5e68" font-size="14">Carry — ideation map, distilled from mentor consultation + idea log</text>
</svg>
