<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Equilibrium Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#e5deff",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#1b0f4d",
                        "tertiary-fixed-dim": "#ffb690",
                        "surface-container-highest": "#e7e2da",
                        "primary-container": "#43806b",
                        "on-tertiary": "#ffffff",
                        "surface-tint": "#2b6956",
                        "on-background": "#1d1b17",
                        "on-tertiary-fixed": "#341100",
                        "outline-variant": "#bfc9c3",
                        "primary-fixed": "#b0f0d7",
                        "on-primary-container": "#f5fff8",
                        "inverse-primary": "#94d3bb",
                        "error": "#ba1a1a",
                        "on-primary": "#ffffff",
                        "secondary-container": "#c3b8fe",
                        "primary-fixed-dim": "#94d3bb",
                        "on-primary-fixed-variant": "#0a513f",
                        "surface-dim": "#ded9d2",
                        "on-surface-variant": "#404944",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#fef9f1",
                        "tertiary": "#8f4920",
                        "surface-container": "#f2ede6",
                        "secondary-fixed-dim": "#c9bfff",
                        "surface": "#fef9f1",
                        "on-tertiary-fixed-variant": "#74350c",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#ad6135",
                        "background": "#fef9f1",
                        "secondary": "#5f5694",
                        "primary": "#286653",
                        "on-surface": "#1d1b17",
                        "surface-container-high": "#ede7e0",
                        "tertiary-fixed": "#ffdbca",
                        "surface-container-low": "#f8f3eb",
                        "on-primary-fixed": "#002117",
                        "on-tertiary-container": "#fffbff",
                        "on-secondary-fixed-variant": "#473e7b",
                        "inverse-surface": "#32302b",
                        "outline": "#707974",
                        "on-secondary-container": "#504684",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f5f0e8",
                        "surface-variant": "#e7e2da",
                        "brand-low": "#7FB39A",
                        "brand-low-text": "#4F8C77",
                        "brand-medium": "#E0A83F",
                        "brand-medium-text": "#A67B2E",
                        "brand-high": "#D46A4E",
                        "brand-high-text": "#D46A4E"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "lg": "48px",
                        "margin-desktop": "40px",
                        "base": "8px",
                        "sm": "12px",
                        "xl": "64px",
                        "md": "24px",
                        "xs": "4px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "headline-md": ["Literata"],
                        "body-md": ["Hanken Grotesk"],
                        "display-lg": ["Literata"],
                        "body-lg": ["Hanken Grotesk"],
                        "label-sm": ["Hanken Grotesk"],
                        "headline-sm": ["Literata"],
                        "display-lg-mobile": ["Literata"],
                        "label-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "headline-md": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "headline-sm": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #F7F2EA; color: #1d1b17; }
        .card-border { border: 1px solid rgba(58, 56, 51, 0.1); }
        .card-focus:hover { border: 2px solid #286653; transform: translateY(-2px); transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col font-body-md text-body-md">
<header class="w-full sticky top-0 z-50 bg-background dark:bg-background border-b border-on-surface/10">
<div class="flex justify-between items-center px-margin-desktop py-base max-w-[1280px] mx-auto w-full">
<div class="font-headline-md text-headline-md text-primary dark:text-primary-fixed-dim">
                Equilibrium
            </div>
<div class="flex items-center space-x-md">
<span class="material-symbols-outlined cursor-pointer hover:text-primary transition-colors duration-200 text-on-surface-variant active:opacity-70 text-3xl" data-icon="account_circle" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</div>
</div>
</header>
<main class="flex-grow max-w-[1280px] mx-auto w-full px-margin-mobile md:px-margin-desktop py-xl space-y-xl">
<section class="text-center space-y-md">
<h1 class="font-display-lg text-display-lg text-primary max-w-2xl mx-auto md:block hidden">You're at 78% this week, Taylor.</h1>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary max-w-xl mx-auto block md:hidden">You're at 78% this week, Taylor.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Your energy is leaning medium-high. Remember to pace yourself.</p>
</section>
<section class="flex justify-center items-center py-lg">
<div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center">
<svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="#e7e2da" stroke-width="10"></circle>
<circle class="transition-all duration-1000 ease-out" cx="50" cy="50" fill="none" r="45" stroke="#E0A83F" stroke-dasharray="282.7" stroke-dashoffset="62.2" stroke-width="10"></circle>
</svg>
<div class="absolute flex flex-col items-center justify-center">
<span class="font-display-lg text-display-lg text-brand-medium-text">78%</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Capacity</span>
</div>
</div>
</section>
<div class="py-lg w-full"></div>
<section class="grid grid-cols-1 md:grid-cols-3 gap-gutter lg:grid-cols-4 justify-center">
<button class="bg-surface-container-lowest rounded-xl p-md card-border card-focus flex flex-col items-start space-y-sm text-left group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 0;">schedule</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Time</span>
<div class="inline-flex items-center space-x-xs px-2 py-1 rounded-full bg-brand-medium/20 text-brand-medium-text">
<span class="font-label-sm text-label-sm">Moderate Load</span>
</div>
</button>
<button class="bg-surface-container-lowest rounded-xl p-md card-border card-focus flex flex-col items-start space-y-sm text-left group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 0;">group</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Social</span>
<div class="inline-flex items-center space-x-xs px-2 py-1 rounded-full bg-brand-low/20 text-brand-low-text">
<span class="font-label-sm text-label-sm">Low Energy</span>
</div>
</button>
<button class="bg-surface-container-lowest rounded-xl p-md card-border card-focus flex flex-col items-start space-y-sm text-left group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 0;">fitness_center</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Physical</span>
<div class="inline-flex items-center space-x-xs px-2 py-1 rounded-full bg-brand-high/20 text-brand-high-text">
<span class="font-label-sm text-label-sm">High Effort</span>
</div>
</button>
<button class="bg-surface-container-lowest rounded-xl p-md card-border card-focus flex flex-col items-start space-y-sm text-left group">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 0;">psychology</span>
<span class="font-headline-sm text-headline-sm text-on-surface">Mental</span>
<div class="inline-flex items-center space-x-xs px-2 py-1 rounded-full bg-brand-medium/20 text-brand-medium-text">
<span class="font-label-sm text-label-sm">Balanced</span>
</div>
</button>

</section>
</main>
<footer class="w-full mt-xl bg-surface-container-lowest dark:bg-surface-container-lowest border-t border-on-surface/5">
<div class="flex flex-col md:flex-row justify-between items-center px-margin-desktop py-lg max-w-[1280px] mx-auto space-y-md md:space-y-0 text-on-surface-variant dark:text-on-surface-variant font-body-md text-body-md cursor-default">
<span class="font-headline-sm text-headline-sm text-primary">Equilibrium</span>
<div class="flex space-x-md">
<a class="hover:text-tertiary transition-colors" href="#">Support</a>
<a class="hover:text-tertiary transition-colors" href="#">Privacy</a>
<a class="hover:text-tertiary transition-colors" href="#">Terms</a>
</div>
<span class="">© 2024 Equilibrium Student Wellness</span>
</div>
</footer>


</body></html>
