{% extends "base.html" %}

{% block title %}Equilibrium - Home{% endblock %}

{% block body_class %}has-bottom-nav{% endblock %}

{% block content %}

<main class="container">
  <section class="hero">
    <h2 class="text-headline-md">You're at <span class="accent">78%</span> this week</h2>
    <p class="text-body-md">Looking good. Remember to take a breath.</p>
  </section>

  <section class="capacity-section">
    <div class="pulse-core">
      <div class="pulse-ring-outer"></div>
      <div class="pulse-ring-inner"></div>
      <div class="pulse-inner-core">
        <span class="value text-display-lg-mobile">78%</span>
        <span class="label text-label-sm">Capacity</span>
      </div>
    </div>
  </section>

  <section class="category-list" >

    <button class="category-row">
      <div class="category-row-left">
        <span class="category-row-icon material-symbols-outlined">schedule</span>
        <div>
          <h3 class="text-headline-sm">Time</h3>
          <p>Moderate capacity</p>
        </div>
      </div>
      <span class="material-symbols-outlined chevron">expand_more</span>
    </button>

    <button class="category-row">
      <div class="category-row-left">
        <span class="category-row-icon material-symbols-outlined">groups</span>
        <div>
          <h3 class="text-headline-sm">Social</h3>
          <p>Low energy</p>
        </div>
      </div>
      <span class="material-symbols-outlined chevron">expand_more</span>
    </button>

    <button class="category-row">
      <div class="category-row-left">
        <span class="category-row-icon material-symbols-outlined">directions_run</span>
        <div>
          <h3 class="text-headline-sm">Physical</h3>
          <p>Feeling rested</p>
        </div>
      </div>
      <span class="material-symbols-outlined chevron">expand_more</span>
    </button>

    <button class="category-row">
      <div class="category-row-left">
        <span class="category-row-icon material-symbols-outlined">psychology</span>
        <div>
          <h3 class="text-headline-sm">Mental</h3>
          <p>High focus</p>
        </div>
      </div>
      <span class="material-symbols-outlined chevron">expand_more</span>
    </button>

  </section>
</main>

{% endblock %}
