<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Equilibrium - Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                      "on-surface": "#1d1b17",
                      "outline-variant": "#bfc9c3",
                      "on-tertiary-fixed-variant": "#74350c",
                      "on-primary-fixed-variant": "#0a513f",
                      "on-secondary-fixed-variant": "#473e7b",
                      "background": "#fef9f1",
                      "secondary": "#5f5694",
                      "primary-container": "#43806b",
                      "inverse-primary": "#94d3bb",
                      "tertiary": "#8f4920",
                      "inverse-surface": "#32302b",
                      "surface-container-high": "#ede7e0",
                      "surface-dim": "#ded9d2",
                      "tertiary-fixed": "#ffdbca",
                      "secondary-container": "#c3b8fe",
                      "error": "#ba1a1a",
                      "primary": "#286653",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed": "#002117",
                      "surface-container-low": "#f8f3eb",
                      "tertiary-container": "#ad6135",
                      "inverse-on-surface": "#f5f0e8",
                      "surface-tint": "#2b6956",
                      "surface-variant": "#e7e2da",
                      "on-error": "#ffffff",
                      "surface-container": "#f2ede6",
                      "primary-fixed-dim": "#94d3bb",
                      "secondary-fixed-dim": "#c9bfff",
                      "primary-fixed": "#b0f0d7",
                      "on-secondary-fixed": "#1b0f4d",
                      "on-secondary-container": "#504684",
                      "on-surface-variant": "#404944",
                      "surface-bright": "#fef9f1",
                      "surface": "#fef9f1",
                      "outline": "#707974"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "base": "8px",
                      "xl": "64px",
                      "gutter": "20px",
                      "md": "24px",
                      "xs": "4px",
                      "sm": "12px",
                      "margin-mobile": "16px",
                      "lg": "48px",
                      "margin-desktop": "40px"
              },
              "fontFamily": {
                      "body-lg": [
                              "Hanken Grotesk"
                      ],
                      "label-md": [
                              "Hanken Grotesk"

                      "headline-md": [
                              "Literata"
                      ],
                      "display-lg-mobile": [
                              "Literata"
                      ],
                      "headline-sm": [
                              "Literata"
                      ],
                      "label-sm": [
                              "Hanken Grotesk"
                      ],
                      "display-lg": [
                              "Literata"
                      ],
                      "body-md": [

                      ]
              },
              "fontSize": {
                      "body-lg": [

                      "display-lg-mobile": [

                      "headline-sm": [

                      "label-sm": [
                              "12px",

                      "display-lg": [

          },
        }

<style>
        @keyframes pulse-gentle {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .pulse-circle {
            animation: pulse-gentle 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg min-h-screen flex flex-col pb-24 selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar (Hidden on Mobile Nav Shell, used for branding here) -->
<header class="w-full top-0 bg-background dark:bg-background flex justify-between items-center px-margin-mobile py-base pt-6 sticky z-10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="spa" data-weight="fill" style="font-variation-settings: 'FILL' 1;">spa</span>
<span class="font-headline-sm text-headline-sm text-primary font-bold">Balance</span>
</div>
<button aria-label="Profile" class="w-10 h-10 rounded-full border border-outline-variant flex items-center justify-center hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_circle">account_circle</span>
</button>
</header>
<main class="flex-1 px-margin-mobile flex flex-col gap-8 pt-4 max-w-[1280px] mx-auto w-full">
<!-- Headline -->
<section class="text-center mt-2">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2">You're at <span class="text-primary">78%</span> this week</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Looking good. Remember to take a breath.</p>
</section>
<!-- Central Pulse Gauge -->
<section class="flex justify-center items-center py-6 relative">
<div class="relative w-48 h-48 rounded-full flex items-center justify-center">
<!-- Outer pulsing ring -->
<div class="absolute inset-0 rounded-full border-[1.5px] border-secondary-container pulse-circle"></div>
<div class="absolute inset-2 rounded-full border border-primary-container opacity-50"></div>
<!-- Inner core -->
<div class="relative w-36 h-36 rounded-full bg-surface-container-highest flex flex-col items-center justify-center border border-on-surface/[0.1] shadow-sm z-10">
<span class="font-display-lg-mobile text-display-lg-mobile text-primary font-bold">78%</span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest mt-1">Capacity</span>
</div>
</div>
</section>
<!-- Spacer for Breathable Zone -->
<div class="h-4"></div>
<!-- Category Cards (Bento-ish Stack on Mobile) -->
<section class="flex flex-col gap-4">
<!-- Time Card -->
<button class="w-full bg-surface-container-lowest rounded-xl p-4 border border-on-surface/[0.1] flex items-center justify-between hover:border-primary/50 transition-colors group text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="schedule">schedule</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface text-[18px]">Time</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-0.5">Moderate capacity</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="expand_more">expand_more</span>
</button>
<!-- Social Card -->
<button class="w-full bg-surface-container-lowest rounded-xl p-4 border border-on-surface/[0.1] flex items-center justify-between hover:border-secondary/50 transition-colors group text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-secondary group-hover:bg-secondary-container group-hover:text-on-secondary-container transition-colors">
<span class="material-symbols-outlined" data-icon="groups">groups</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface text-[18px]">Social</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-0.5">Low energy</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-secondary transition-colors" data-icon="expand_more">expand_more</span>
</button>
<!-- Physical Card -->
<button class="w-full bg-surface-container-lowest rounded-xl p-4 border border-on-surface/[0.1] flex items-center justify-between hover:border-tertiary/50 transition-colors group text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-tertiary group-hover:bg-tertiary-container group-hover:text-on-tertiary-container transition-colors">
<span class="material-symbols-outlined" data-icon="directions_run">directions_run</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface text-[18px]">Physical</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-0.5">Feeling rested</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-tertiary transition-colors" data-icon="expand_more">expand_more</span>
</button>
<!-- Mental Card -->
<button class="w-full bg-surface-container-lowest rounded-xl p-4 border border-on-surface/[0.1] flex items-center justify-between hover:border-primary/50 transition-colors group text-left">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-surface-container-low flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="psychology">psychology</span>
</div>
<div>
<h3 class="font-headline-sm text-headline-sm text-on-surface text-[18px]">Mental</h3>
<p class="font-body-md text-body-md text-on-surface-variant text-sm mt-0.5">High focus</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="expand_more">expand_more</span>
</button>
</section>
</main>
<!-- Bottom Nav Bar -->
<nav class="bg-surface-container-low dark:bg-surface-container-low font-label-md text-label-md font-headline-sm text-headline-sm text-primary fixed bottom-0 w-full z-50 rounded-t-xl border-t border-on-surface/[0.1] fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-4 pt-2 md:hidden">
<!-- Home (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-full px-sm py-xs scale-95 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home" data-weight="fill" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</a>
<!-- Check-in (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-variant dark:hover:bg-surface-variant rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="rebase_edit">rebase_edit</span>
<span class="font-label-sm text-label-sm mt-1">Check-in</span>
</a>
<!-- Insights (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant p-2 hover:bg-surface-variant dark:hover:bg-surface-variant rounded-xl transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="analytics">analytics</span>
<span class="font-label-sm text-label-sm mt-1">Insights</span>
</a>
</nav>
</body></html>
